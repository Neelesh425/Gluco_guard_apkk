<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlucoGuard — Lifestyle Planner</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="bg-particles"></div>

  <nav class="navbar">
    <a class="nav-logo" href="/">🛡️ GlucoGuard</a>
    <div class="nav-links">
      <a href="/#predict">Predict</a>
      <a href="/#insights">Insights</a>
      <a href="/lifestyle" class="active">Lifestyle</a>
      <a href="/#about">About</a>
    </div>
  </nav>

  <main class="lifestyle-container section visible">
    <div class="section-header">
      <h2>Lifestyle Action Plan</h2>
      <p>Generate a personalized plan based on your health goals</p>
    </div>
    
    <div class="glass-card">
      <div class="goal-selector">
        <select id="goalSelect" class="form-control" style="flex:1; background: rgba(0,0,0,0.2); color: white; border: 1px solid var(--glass-border); padding: 12px; border-radius: 8px;">
          <option value="weight_loss">Weight Loss</option>
          <option value="blood_sugar">Lower Blood Sugar</option>
          <option value="active">More Active</option>
        </select>
        <button id="generatePlanBtn" class="btn btn-primary btn-glow">Generate Plan</button>
      </div>
      
      <div id="planContent" class="plan-output">
        <h3 style="margin-bottom:16px;">Your Plan</h3>
        <p style="color:var(--text-muted)">Select a goal above to generate your customized lifestyle plan.</p>
      </div>
      
      <div style="margin-top: 30px; text-align: center;">
        <a href="/" class="btn btn-secondary">← Back to Predictor</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© Neelesh Ranjan — GlucoGuard | Powered by XGBoost ML</p>
  </footer>

  <script>
    document.getElementById('generatePlanBtn').addEventListener('click', () => {
      const goal = document.getElementById('goalSelect').value;
      const content = document.getElementById('planContent');
      
      let html = '<ul style="list-style:none; padding:0;">';
      if(goal === 'weight_loss') {
        html += '<li style="margin-bottom:12px">🥗 <strong>Diet:</strong> Caloric deficit of 300-500 calories/day.</li>';
        html += '<li style="margin-bottom:12px">🏃 <strong>Exercise:</strong> 45 mins of moderate cardio 5x/week.</li>';
        html += '<li style="margin-bottom:12px">💧 <strong>Hydration:</strong> Drink before meals to feel full.</li>';
      } else if (goal === 'blood_sugar') {
        html += '<li style="margin-bottom:12px">🥦 <strong>Diet:</strong> Focus on low-GI foods, increase fiber intake.</li>';
        html += '<li style="margin-bottom:12px">🚶 <strong>Exercise:</strong> 15-min walk after main meals.</li>';
        html += '<li style="margin-bottom:12px">😴 <strong>Sleep:</strong> 7-8 hours of quality sleep to improve insulin sensitivity.</li>';
      } else {
        html += '<li style="margin-bottom:12px">🏋️ <strong>Exercise:</strong> Mix of strength training and cardio 4x/week.</li>';
        html += '<li style="margin-bottom:12px">🧘 <strong>Flexibility:</strong> Daily stretching or yoga for 10 mins.</li>';
        html += '<li style="margin-bottom:12px">🔋 <strong>Energy:</strong> Regular balanced meals to fuel activities.</li>';
      }
      html += '</ul>';
      
      content.innerHTML = '<h3 style="margin-bottom:16px; color:var(--accent-cyan)">Your Personalized Plan</h3>' + html;
    });
  </script>
</body>
</html>
